<!--
  ReelVault — Razorpay Checkout Integration
  ==========================================
  Yeh snippet aapke "Make Payment →" button ko Razorpay ke checkout modal
  se connect kar deta hai (jaisa screenshot me dikh raha tha — Card / UPI /
  NetBanking / Wallets sab options ke saath).

  KAHAN LAGANA HAI:
  1. Is <script src="https://checkout.razorpay.com/v1/checkout.js"> tag ko
     apne index.html ke </body> se pehle add karein (agar already Razorpay
     script nahi hai).
  2. Neeche wala <script> block bhi apne page me add karein, ya isi file ko
     include kar dein.
  3. "rzp-pay-btn" wale button ki id apne existing "Make Payment →" button
     par set karein (ya jo bhi id already hai use replace kar dein).

  IMPORTANT — SECURITY:
  - "key" field me sirf KEY_ID jaata hai (rzp_test_TUIWn6asBt9Uqv) — yeh public
    hai, isko frontend me rakhna safe hai.
  - key_secret (jo aapki CSV file me tha) KABHI BHI frontend/HTML/JS me mat
    daalna — woh sirf server-side par use hota hai order create/verify karne
    ke liye. Static GitHub Pages site pe backend nahi hota, isliye abhi ke
    liye hum sirf key_id se simple checkout khol rahe hain (test mode ke liye
    theek hai).
  - Jab live payments lene ho (real customers se), Razorpay recommend karta
    hai ki order_id server se generate ho (Cashfree/Vercel function, Node
    server, etc.) — warna amount client-side se tamper ho sakta hai.
-->

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  // Apne cart/checkout logic se yeh values already mil rahi hongi
  function openRazorpayCheckout(amountInRupees, customerEmail, customerPhone) {
    var options = {
      key: "rzp_test_TUIWn6asBt9Uqv", // aapka Razorpay test Key ID
      amount: Math.round(amountInRupees * 100), // paise me, isliye *100
      currency: "INR",
      name: "ReelVault — Digital Reels Store",
      description: "Digital Reels Bundle Purchase",
      image: "https://jadav999.github.io/product/logo.png", // apna logo daal dein

      handler: function (response) {
        // Payment success hone par yahan chalega
        alert(
          "Payment Successful!\nPayment ID: " + response.razorpay_payment_id
        );
        // Yahan aap apna "Order Received!" wala success screen dikha sakte hain
        // ya email/webhook trigger kar sakte hain.
      },

      prefill: {
        email: customerEmail || "",
        contact: customerPhone || "",
      },

      notes: {
        source: "ReelVault Website",
      },

      theme: {
        color: "#000000",
      },

      modal: {
        ondismiss: function () {
          console.log("Checkout band kar diya user ne");
        },
      },
    };

    var rzp = new Razorpay(options);

    rzp.on("payment.failed", function (response) {
      alert("Payment Failed: " + response.error.description);
    });

    rzp.open();
  }

  // Apne existing "Make Payment →" button se yeh function call karein:
  // Example:
  document.addEventListener("DOMContentLoaded", function () {
    var payBtn = document.getElementById("rzp-pay-btn"); // apne button ki id yahan match karein
    if (payBtn) {
      payBtn.addEventListener("click", function (e) {
        e.preventDefault();

        // Yeh 3 values apne existing cart state se lein
        var totalAmount = window.cartTotal || 69; // fallback ₹69
        var email = document.getElementById("checkout-email")
          ? document.getElementById("checkout-email").value
          : "";
        var phone = document.getElementById("checkout-phone")
          ? document.getElementById("checkout-phone").value
          : "";

        if (!email || !phone) {
          alert("Please enter your email and phone number first.");
          return;
        }

        openRazorpayCheckout(totalAmount, email, phone);
      });
    }
  });
</script>
